[tool.coverage.run]
branch = true
source = [ "ai_worker" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/ai-worker/html'
 --cov-report xml:'../../coverage/apps/ai-worker/coverage.xml'
 --html='../../reports/apps/ai-worker/unittests/html/index.html'
 --junitxml='../../reports/apps/ai-worker/unittests/junit.xml'
"""

[tool.poetry]
name = "ai-worker"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "ai_worker"

  [tool.poetry.dependencies]
  python = ">=3.9,<3.11"
  confluent-kafka = "^2.12.2"
  scikit-learn = "<1.6"
  pandas = "^2.3.3"
  numpy = "<2"
  psycopg2-binary = "^2.9.11"
  python-dotenv = "^1.2.1"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  flake8 = "7.1.1"
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
